<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'">
  <title>Search menu</title>
  <link rel="stylesheet" href="theme.css">
  <style>
    html, body { margin: 0; background: transparent; overflow: hidden; font-family: var(--font-body); color: var(--text); font-size: 13px; user-select: none; }
    #menu { zoom: var(--scale, 1); background: rgba(18, 15, 12, 0.97); border: 1px solid var(--line-strong); border-radius: 6px; padding: 4px 0; }
    .hd { display: flex; justify-content: space-between; padding: 4px 10px 6px; font-family: var(--font-title); color: var(--gold); font-size: 14px; border-bottom: 1px solid var(--line); }
    .hd span { font-family: var(--font-body); font-size: 11px; color: var(--muted); }
    .grp { padding: 6px 10px 2px; font-size: 10.5px; letter-spacing: .6px; text-transform: uppercase; color: var(--gold-soft); }
    .it { display: flex; gap: 8px; align-items: baseline; padding: 4px 10px; cursor: pointer; }
    .it:hover { background: rgba(240, 197, 107, 0.16); }
    .it .k { width: 14px; flex: none; color: var(--gold); font-weight: 700; text-align: right; font-size: 12px; }
    .it .body { flex: 1; min-width: 0; }
    .it .lbl { line-height: 1.3; }
    .it .s { font-family: Consolas, monospace; font-size: 11.5px; color: #f4d898; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .it.here .lbl { color: var(--take); font-weight: 600; }
    .it.done { opacity: .5; }
  </style>
</head>
<body>
  <div id="menu"></div>
  <script src="common.js"></script>
  <script src="menu.js"></script>
</body>
</html>
